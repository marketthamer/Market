<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة</title>
    <!-- استدعاء خط عربي احترافي من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* تنسيقات الصفحة */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* خلفية متدرجة داكنة */
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* الحاوية الرئيسية بتأثير الزجاج */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
            width: 500px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* تنسيق الشعار المتحرك */
        .icon-wrapper {
            margin-bottom: 20px;
            display: inline-block;
        }

        .gear-icon {
            width: 80px;
            height: 80px;
            fill: #f39c12; /* لون ذهبي مميز */
            animation: spin 4s linear infinite; /* حركة الدوران */
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* النصوص */
        h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            color: #f39c12;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        .footer {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-top: 20px;
        }

        /* تنسيقات زر اللعبة */
        .game-btn {
            background: rgba(243, 156, 18, 0.2);
            border: 1px solid #f39c12;
            color: #f39c12;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            margin: 10px 0 20px 0;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .game-btn:hover {
            background: #f39c12;
            color: #fff;
            transform: scale(1.05);
        }

        /* قائمة اختيار الألعاب */
        #games-menu {
            display: none;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s;
            width: 100%;
        }

        .menu-btn {
            width: 100%;
            justify-content: center;
            margin: 0;
        }

        /* تنسيقات اللعبة (X-O) */
        #xo-container {
            display: none; /* مخفي افتراضياً */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }

        /* تنسيقات لعبة الأفعى */
        #snake-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        canvas {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #f39c12;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .snake-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- القسم الرئيسي: رسالة الصيانة -->
        <div id="main-content">
            <div class="icon-wrapper">
                <!-- أيقونة الترس SVG -->
                <svg class="gear-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </div>
            
            <!-- زر تشغيل اللعبة -->
            <div>
                <button class="game-btn" onclick="showMenu()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 6H3C1.89 6 1 6.89 1 8V16C1 17.11 1.89 18 3 18H21C22.11 18 23 17.11 23 16V8C23 6.89 22.11 6 21 6ZM6 13C5.45 13 5 12.55 5 12C5 11.45 5.45 11 6 11C6.55 11 7 11.45 7 12C7 12.55 6.55 13 6 13ZM9 13C8.45 13 8 12.55 8 12C8 11.45 8.45 11 9 11C9.55 11 10 11.45 10 12C10 12.55 9.55 13 9 13ZM12 16H18V14H12V16ZM18 10H12V8H18V10Z"/>
                    </svg>
                    العب الآن
                </button>
            </div>

            <h1>الموقع تحت الصيانة</h1>
            <p>نعتذر عن الإزعاج، نقوم حالياً بإجراء بعض التحسينات والتحديثات لتقديم تجربة أفضل لكم.<br>سنعود للعمل قريباً جداً.</p>
            
            <div class="footer">
                &copy; 2024 اسم موقعك. جميع الحقوق محفوظة.
            </div>
        </div>
        
        <!-- قائمة اختيار الألعاب -->
        <div id="games-menu">
            <h2 style="color:#f39c12;">اختر لعبة</h2>
            <button class="game-btn menu-btn" onclick="startXO()">لعبة X-O (ضد الكمبيوتر)</button>
            <button class="game-btn menu-btn" onclick="startSnake()">لعبة الأفعى</button>
            <button class="back-btn" onclick="hideMenu()">رجوع</button>
        </div>

        <!-- لعبة X-O -->
        <div id="xo-container">
            <h2 style="color:#f39c12; margin:0;">X-O ضد الذكاء</h2>
            <div class="board" id="board">
                <div class="cell" onclick="play(0)"></div>
                <div class="cell" onclick="play(1)"></div>
                <div class="cell" onclick="play(2)"></div>
                <div class="cell" onclick="play(3)"></div>
                <div class="cell" onclick="play(4)"></div>
                <div class="cell" onclick="play(5)"></div>
                <div class="cell" onclick="play(6)"></div>
                <div class="cell" onclick="play(7)"></div>
                <div class="cell" onclick="play(8)"></div>
            </div>
            <div id="status" style="margin-bottom:10px; height:20px;"></div>
            <div style="display:flex; gap:10px;">
                <button class="back-btn" onclick="resetXO()" style="background:rgba(243, 156, 18, 0.2); border-color:#f39c12; color:#f39c12;">لعبة جديدة</button>
                <button class="back-btn" onclick="backToMenu()">القائمة الرئيسية</button>
            </div>
        </div>

        <!-- لعبة الأفعى -->
        <div id="snake-container">
            <h2 style="color:#f39c12; margin:0 0 10px 0;">لعبة الأفعى</h2>
            <canvas id="snakeCanvas" width="300" height="300"></canvas>
            <div class="snake-controls">
                <div></div>
                <button class="ctrl-btn" onclick="changeDirection({keyCode:38})">▲</button>
                <div></div>
                <button class="ctrl-btn" onclick="changeDirection({keyCode:37})">◄</button>
                <button class="ctrl-btn" onclick="changeDirection({keyCode:40})">▼</button>
                <button class="ctrl-btn" onclick="changeDirection({keyCode:39})">►</button>
            </div>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <button class="back-btn" onclick="resetSnake()" style="background:rgba(243, 156, 18, 0.2); border-color:#f39c12; color:#f39c12;">لعبة جديدة</button>
                <button class="back-btn" onclick="backToMenu()">القائمة الرئيسية</button>
            </div>
        </div>
    </div>

    <script>
        // --- إدارة القوائم ---
        function showMenu() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('games-menu').style.display = 'flex';
        }

        function hideMenu() {
            document.getElementById('games-menu').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('xo-container').style.display = 'none';
            document.getElementById('snake-container').style.display = 'none';
            stopSnake(); // إيقاف الأفعى عند الخروج
            document.getElementById('games-menu').style.display = 'flex';
        }

        // --- منطق لعبة X-O (ضد الكمبيوتر) ---
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        function startXO() {
            document.getElementById('games-menu').style.display = 'none';
            document.getElementById('xo-container').style.display = 'flex';
            resetXO();
        }

        function play(index) {
            if (gameBoard[index] === '' && gameActive && currentPlayer === 'X') {
                // دور اللاعب
                gameBoard[index] = currentPlayer;
                updateCell(index, 'X');
                
                if (!checkWinner()) {
                    currentPlayer = 'O';
                    // دور الكمبيوتر (تأخير بسيط للواقعية)
                    setTimeout(computerMove, 500);
                }
            }
        }

        function updateCell(index, player) {
            const cell = document.getElementsByClassName('cell')[index];
            cell.innerText = player;
            cell.classList.add(player.toLowerCase());
        }

        function computerMove() {
            if (!gameActive) return;

            // ذكاء بسيط: 1. حاول الفوز، 2. امنع الخصم، 3. العب عشوائي
            let move = findBestMove('O') || findBestMove('X') || getRandomMove();

            if (move !== -1) {
                gameBoard[move] = 'O';
                updateCell(move, 'O');
                if (!checkWinner()) currentPlayer = 'X';
            }
        }

        function findBestMove(player) {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let condition of winConditions) {
                const [a, b, c] = condition;
                // البحث عن خانتين ممتلئتين والثالثة فارغة
                if (gameBoard[a] === player && gameBoard[b] === player && gameBoard[c] === '') return c;
                if (gameBoard[a] === player && gameBoard[c] === player && gameBoard[b] === '') return b;
                if (gameBoard[b] === player && gameBoard[c] === player && gameBoard[a] === '') return a;
            }
            return null;
        }

        function getRandomMove() {
            let available = [];
            gameBoard.forEach((cell, index) => {
                if (cell === '') available.push(index);
            });
            if (available.length === 0) return -1;
            // تفضيل المنتصف إذا كان فارغاً
            if (available.includes(4)) return 4;
            return available[Math.floor(Math.random() * available.length)];
        }

        function checkWinner() {
            const winConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let condition of winConditions) {
                const [a, b, c] = condition;
                if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
                    document.getElementById('status').innerText = gameBoard[a] === 'X' ? 'أنت فزت!' : 'الكمبيوتر فاز!';
                    gameActive = false;
                    return true;
                }
            }

            if (!gameBoard.includes('')) {
                document.getElementById('status').innerText = 'تعادل!';
                gameActive = false;
                return true;
            }
            return false;
        }

        function resetXO() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            document.getElementById('status').innerText = '';
            const cells = document.getElementsByClassName('cell');
            for (let cell of cells) {
                cell.innerText = '';
                cell.classList.remove('x', 'o');
            }
        }

        // --- منطق لعبة الأفعى (Snake) ---
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const box = 15; // حجم المربع
        let snake = [];
        let food = {};
        let d;
        let gameLoop;
        let score = 0;

        function startSnake() {
            document.getElementById('games-menu').style.display = 'none';
            document.getElementById('snake-container').style.display = 'flex';
            resetSnake();
        }

        function resetSnake() {
            snake = [{ x: 9 * box, y: 10 * box }];
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
            score = 0;
            d = null; // الانتظار حتى يضغط اللاعب
            clearInterval(gameLoop);
            gameLoop = setInterval(drawSnake, 100);
        }

        function stopSnake() {
            clearInterval(gameLoop);
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            let key = event.keyCode;
            if (key == 37 && d != "RIGHT") d = "LEFT";
            else if (key == 38 && d != "DOWN") d = "UP";
            else if (key == 39 && d != "LEFT") d = "RIGHT";
            else if (key == 40 && d != "UP") d = "DOWN";
        }

        function drawSnake() {
            ctx.fillStyle = "#2c5364"; // مسح الخلفية
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#f39c12" : "#ffffff"; // رأس الأفعى ذهبي
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#e74c3c"; // لون الطعام
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // أكل الطعام
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                food = {
                    x: Math.floor(Math.random() * 19 + 1) * box,
                    y: Math.floor(Math.random() * 19 + 1) * box
                };
            } else {
                if(d) snake.pop(); // إزالة الذيل إذا لم تأكل وتحركت
            }

            let newHead = { x: snakeX, y: snakeY };

            // الخسارة (الاصطدام بالجدار أو النفس)
            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameLoop);
                // رسم نص الخسارة
                ctx.fillStyle = "white";
                ctx.font = "30px Cairo";
                ctx.fillText("انتهت اللعبة", 80, 150);
                return;
            }

            if(d) snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }
    </script>
</body>
</html>
